apiVersion: operator.openshift.io/v1
kind: Network
metadata:
  name: cluster
spec:
  defaultNetwork:
    type: OVNKubernetes
    ovnKubernetesConfig:
      ipv4:
        internalJoinSubnet: "100.101.0.0/16"
        internalTransitSwitchSubnet: "100.102.0.0/16"
      gatewayConfig:
        routingViaHost: true
        ipForwarding: Global
        ipv4:
          internalMasqueradeSubnet: "169.254.0.0/17"
status: {}
