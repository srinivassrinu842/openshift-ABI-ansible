---
# ==============================================================================
# Tasks: Validate Node Network & Disk Properties (invoked per node)
# ==============================================================================

- name: "Validate network mode for {{ current_node }}"
  ansible.builtin.assert:
    that:
      - hostvars[current_node].network_mode is defined
      - hostvars[current_node].network_mode in ['bond', 'single_nic']
    fail_msg: "Node '{{ current_node }}' must specify network_mode as 'bond' or 'single_nic'."

- name: "Validate bonding parameters for {{ current_node }}"
  ansible.builtin.assert:
    that:
      - hostvars[current_node].bond_config is defined
      - hostvars[current_node].bond_config.name is defined
      - hostvars[current_node].bond_config.mode in ['802.3ad', 'active-backup', 'balance-xor']
      - hostvars[current_node].bond_config.interfaces is defined
      - hostvars[current_node].bond_config.interfaces | length >= 2
    fail_msg: "Node '{{ current_node }}' has invalid bond_config. Must specify name, valid mode, and >= 2 interfaces."
  when: hostvars[current_node].network_mode | default('bond') == 'bond'

- name: "Validate single NIC parameters for {{ current_node }}"
  ansible.builtin.assert:
    that:
      - hostvars[current_node].nic_config is defined
      - hostvars[current_node].nic_config.name is defined
      - hostvars[current_node].nic_config.mac is defined
      - hostvars[current_node].nic_config.ip is defined
      - hostvars[current_node].nic_config.gateway is defined
    fail_msg: "Node '{{ current_node }}' has invalid nic_config. Must specify name, mac, ip, and gateway."
  when: hostvars[current_node].network_mode | default('bond') == 'single_nic'

- name: "Validate root device hints for {{ current_node }}"
  ansible.builtin.assert:
    that:
      - hostvars[current_node].root_device_hints is defined
      - hostvars[current_node].root_device_hints is mapping
    fail_msg: "Node '{{ current_node }}' must define root_device_hints as a dictionary."
  when: hostvars[current_node].root_device_hints is defined
