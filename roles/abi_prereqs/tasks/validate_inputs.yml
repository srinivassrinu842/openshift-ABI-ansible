---
# ==============================================================================
# Tasks: Validate User Inputs, Files and Architecture
# ==============================================================================

- name: Assert minimum master nodes in inventory
  ansible.builtin.assert:
    that:
      - groups['masters'] is defined
      - groups['masters'] | length >= 3
    fail_msg: "At least 3 master (control-plane) nodes must be defined in the inventory for high availability."

- name: Assert rendezvous node is defined
  ansible.builtin.assert:
    that:
      - rendezvous_ip is defined
      - rendezvous_ip | length > 0
    fail_msg: "'rendezvous_ip' must be specified in group_vars/all.yml."

- name: Assert rendezvous IP matches one of the master node IPs
  ansible.builtin.assert:
    that:
      - rendezvous_ip in (groups['masters'] | map('extract', hostvars) | map(attribute='ansible_host') | list)
    fail_msg: "Rendezvous IP '{{ rendezvous_ip }}' must match the ansible_host of one master node."

- name: Validate Pull Secret file or raw string
  ansible.builtin.assert:
    that:
      - (pull_secret_raw is defined and pull_secret_raw | length > 0) or (pull_secret_file is defined and (lookup('file', pull_secret_file, errors='ignore') | length > 0))
    fail_msg: "Red Hat pull secret must be provided via 'pull_secret_raw' or an existing 'pull_secret_file'."

- name: Validate SSH public key file or raw string
  ansible.builtin.assert:
    that:
      - (ssh_public_key_raw is defined and ssh_public_key_raw | length > 0) or (ssh_public_key_file is defined and (lookup('file', ssh_public_key_file, errors='ignore') | length > 0))
    fail_msg: "SSH public key must be provided via 'ssh_public_key_raw' or an existing 'ssh_public_key_file'."

- name: Validate platform_type
  ansible.builtin.assert:
    that:
      - platform_type is defined
      - platform_type in ['baremetal', 'none']
    fail_msg: "'platform_type' must be either 'baremetal' or 'none'."

- name: Validate VIPs if platform_type is baremetal
  ansible.builtin.assert:
    that:
      - api_vips is defined and api_vips | length > 0
      - ingress_vips is defined and ingress_vips | length > 0
    fail_msg: "'api_vips' and 'ingress_vips' are required when platform_type is 'baremetal'."
  when: platform_type == 'baremetal'

- name: Validate proxy settings if enabled
  ansible.builtin.assert:
    that:
      - http_proxy is defined and http_proxy | length > 0
    fail_msg: "'http_proxy' must be set when 'proxy_enabled' is true."
  when: proxy_enabled | default(false) | bool

- name: Validate additional trust bundle file exists if configured
  ansible.builtin.assert:
    that:
      - lookup('file', additional_trust_bundle_file, errors='ignore') | length > 0
    fail_msg: "additional_trust_bundle_file '{{ additional_trust_bundle_file }}' was specified but cannot be read."
  when:
    - additional_trust_bundle_file is defined
    - additional_trust_bundle_file | length > 0

- name: Validate per-node configuration for all nodes
  ansible.builtin.include_tasks: validate_node_network.yml
  loop: "{{ (groups['masters'] | default([])) + (groups['workers'] | default([])) }}"
  loop_control:
    loop_var: current_node
