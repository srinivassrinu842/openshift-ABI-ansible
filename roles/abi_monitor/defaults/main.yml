---
# Defaults for abi_monitor role
abi_project_root: "{{ playbook_dir if (playbook_dir | basename != 'playbooks') else (playbook_dir ~ '/..') }}"
bin_dir: "{{ abi_project_root }}/bin"
abi_workspace_dir: "{{ abi_project_root }}/build"
abi_install_dir: "{{ abi_workspace_dir }}/installer_dir"
openshift_install_bin: "{{ bin_dir }}/openshift-install"
oc_bin: "{{ bin_dir }}/oc"
