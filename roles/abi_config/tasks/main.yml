---
# ==============================================================================
# Tasks: Render ABI Configurations and Stage Day-0 Manifests
# ==============================================================================

- name: Ensure target build and installer directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ abi_workspace_dir }}"
    - "{{ abi_install_dir }}"
    - "{{ abi_backup_dir }}"
    - "{{ abi_install_dir }}/openshift"

- name: Clean previous installer artifacts in staging directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ abi_install_dir }}/install-config.yaml"
    - "{{ abi_install_dir }}/agent-config.yaml"
    - "{{ abi_install_dir }}/auth"
    - "{{ abi_install_dir }}/.openshift_install.log"
    - "{{ abi_install_dir }}/.openshift_install_state.json"

- name: Retrieve Pull Secret content
  ansible.builtin.set_fact:
    abi_pull_secret_content: >-
      {{
        pull_secret_raw if (pull_secret_raw | default('') | length > 0)
        else (lookup('file', pull_secret_file, rstrip=False) | default(''))
      }}

- name: Retrieve SSH Public Key content
  ansible.builtin.set_fact:
    abi_ssh_key_content: >-
      {{
        ssh_public_key_raw if (ssh_public_key_raw | default('') | length > 0)
        else (lookup('file', ssh_public_key_file, rstrip=False) | default(''))
      }}

- name: Retrieve Additional Trust Bundle content (if configured)
  ansible.builtin.set_fact:
    abi_trust_bundle_content: >-
      {{
        additional_trust_bundle_raw if (additional_trust_bundle_raw | default('') | length > 0)
        else (lookup('file', additional_trust_bundle_file, rstrip=False) if (additional_trust_bundle_file | default('') | length > 0) else '')
      }}

- name: Compute proxy noProxy list including mandatory default domains
  ansible.builtin.set_fact:
    abi_computed_no_proxy: >-
      {{
        (
          [
            '.cluster.local',
            '.' ~ base_domain,
            '127.0.0.1',
            'localhost',
            machine_network_cidr | default(''),
            service_network_cidr | default(''),
            cluster_network_cidr | default('')
          ]
          + (custom_no_proxy | default([]))
        )
        | reject('equalto', '')
        | unique
        | join(',')
      }}
  when: proxy_enabled | default(false) | bool

- name: Render install-config.yaml into installer directory
  ansible.builtin.template:
    src: install-config.yaml.j2
    dest: "{{ abi_install_dir }}/install-config.yaml"
    mode: "0600"

- name: Render agent-config.yaml into installer directory
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: "{{ abi_install_dir }}/agent-config.yaml"
    mode: "0600"

# ------------------------------------------------------------------------------
# Ingest Day-0 Manifests from manifests/ directory
# ------------------------------------------------------------------------------
- name: Check for custom Day-0 manifests in manifests directory
  ansible.builtin.find:
    paths: "{{ day0_manifests_dir }}"
    patterns:
      - "*.yaml"
      - "*.yml"
    file_type: file
  register: abi_day0_manifest_files
  when:
    - day0_manifests_dir is defined
    - day0_manifests_dir | length > 0

- name: Copy Day-0 custom manifests into <install_dir>/openshift/
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ abi_install_dir }}/openshift/{{ item.path | basename }}"
    mode: "0644"
  loop: "{{ abi_day0_manifest_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - abi_day0_manifest_files is defined
    - abi_day0_manifest_files.matched > 0

- name: Backup rendered configurations to persistent directory
  ansible.builtin.copy:
    src: "{{ abi_install_dir }}/{{ item }}"
    dest: "{{ abi_backup_dir }}/{{ item }}"
    mode: "0600"
  loop:
    - install-config.yaml
    - agent-config.yaml

- name: Backup staged Day-0 manifests to persistent directory
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ abi_backup_dir }}/{{ item.path | basename }}"
    mode: "0644"
  loop: "{{ abi_day0_manifest_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - abi_day0_manifest_files is defined
    - abi_day0_manifest_files.matched > 0

- name: Display summary of generated configurations
  ansible.builtin.debug:
    msg:
      - "=========================================================================="
      - "OpenShift ABI Configurations Rendered Successfully"
      - "=========================================================================="
      - "Install Directory : {{ abi_install_dir }}"
      - "Backup Directory  : {{ abi_backup_dir }}"
      - "Cluster Name      : {{ cluster_name }}.{{ base_domain }}"
      - "Rendezvous Node   : {{ rendezvous_ip }}"
      - "Day-0 Manifests   : {{ abi_day0_manifest_files.matched | default(0) }} manifest(s) copied into openshift/"
      - "Next Phase        : Run playbooks/02_create_iso.yml to create bootable ISO"
      - "=========================================================================="
