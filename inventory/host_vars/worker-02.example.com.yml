---
# Compute Node 02 - Non-Bonded (Single Physical NIC) Setup
node_role: "worker"

root_device_hints:
  deviceName: "/dev/nvme0n1"

# Demonstrating Non-Bonding Network Mode
network_mode: "single_nic"

nic_config:
  name: "eno1"
  mac: "52:54:00:20:02:01"
  ip: "192.168.10.22"
  prefix_length: 24
  gateway: "192.168.10.1"
  dns_servers:
    - "192.168.10.1"
    - "192.168.10.2"
