---
# Compute Node 01 - Bonded LACP Setup
node_role: "worker"

root_device_hints:
  deviceName: "/dev/nvme0n1"

network_mode: "bond"

bond_config:
  name: "bond0"
  mode: "802.3ad"
  options:
    miimon: "100"
    lacp_rate: "fast"
  interfaces:
    - name: "enp1s0"
      mac: "52:54:00:20:01:01"
    - name: "enp2s0"
      mac: "52:54:00:20:01:02"
  ip: "192.168.10.21"
  prefix_length: 24
  gateway: "192.168.10.1"
  dns_servers:
    - "192.168.10.1"
    - "192.168.10.2"
