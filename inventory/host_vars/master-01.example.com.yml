---
# Rendezvous Node & Control Plane Node 01
node_role: "master"

# Hardware storage target for CoreOS installation
root_device_hints:
  deviceName: "/dev/sda"
  # Other optional hints:
  # wwn: "0x600508b400105e2100009000004c0000"
  # serialNumber: "WD-WCC4N0123456"
  # rotational: false

# Network Mode: "bond" or "single_nic"
network_mode: "bond"

bond_config:
  name: "bond0"
  mode: "802.3ad"  # LACP (or "active-backup", "balance-xor")
  options:
    miimon: "100"
    lacp_rate: "fast"
  interfaces:
    - name: "enp1s0"
      mac: "52:54:00:10:01:01"
    - name: "enp2s0"
      mac: "52:54:00:10:01:02"
  ip: "192.168.10.11"
  prefix_length: 24
  gateway: "192.168.10.1"
  dns_servers:
    - "192.168.10.1"
    - "192.168.10.2"
