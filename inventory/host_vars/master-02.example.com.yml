---
# Control Plane Node 02
node_role: "master"

root_device_hints:
  deviceName: "/dev/sda"

network_mode: "bond"

bond_config:
  name: "bond0"
  mode: "active-backup"
  options:
    miimon: "100"
  interfaces:
    - name: "enp1s0"
      mac: "52:54:00:10:02:01"
    - name: "enp2s0"
      mac: "52:54:00:10:02:02"
  ip: "192.168.10.12"
  prefix_length: 24
  gateway: "192.168.10.1"
  dns_servers:
    - "192.168.10.1"
    - "192.168.10.2"
