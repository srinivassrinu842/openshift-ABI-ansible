---
# ==============================================================================
# Global OpenShift Agent-Based Installer (ABI) Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Project Paths & Versioning
# ------------------------------------------------------------------------------
abi_project_root: "{{ playbook_dir if (playbook_dir | basename != 'playbooks') else (playbook_dir ~ '/..') }}"
bin_dir: "{{ abi_project_root }}/bin"
build_dir: "{{ abi_project_root }}/build"
installer_work_dir: "{{ build_dir }}/installer_dir"
iso_output_dir: "{{ build_dir }}/iso"

# OpenShift Version to Install
# Supported: "4.14.x", "4.15.x", "4.16.x", "4.22.22", "latest"
ocp_version: "4.22.22"

# Automated Binary Downloads (openshift-install & oc)
download_binaries: true
openshift_mirror_base_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp"

# ------------------------------------------------------------------------------
# 2. Cluster Identity & Networking
# ------------------------------------------------------------------------------
cluster_name: "ocp-prod"
base_domain: "example.com"

# Virtual IPs (Keepalived VIPs for Bare Metal)
api_vip: "192.168.10.5"
ingress_vip: "192.168.10.6"

# Machine Network CIDR (Required for baremetal agent-config & install-config)
machine_network_cidr: "192.168.10.0/24"

# Cluster & Service Networks (OVN-Kubernetes Defaults)
cluster_network_cidr: "10.128.0.0/14"
cluster_network_host_prefix: 23
service_network_cidr: "172.30.0.0/16"
network_type: "OVNKubernetes"

# ------------------------------------------------------------------------------
# 3. Credentials & Keys
# ------------------------------------------------------------------------------
# Path to Red Hat Pull Secret (Downloaded from console.redhat.com)
pull_secret_file: "{{ abi_project_root }}/pull-secret.txt"

# Path to SSH Public Key for CoreOS Node Access
ssh_public_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa.pub"
# Optional fallback if file is not used:
# ssh_public_key: "ssh-rsa AAAA..."

# ------------------------------------------------------------------------------
# 4. Proxy Configuration (Enterprise Corporate Proxy)
# ------------------------------------------------------------------------------
# Set proxy_enabled to true if cluster nodes need an egress proxy to reach Red Hat / Internet
proxy_enabled: false
http_proxy: "http://proxy.example.com:8080"
https_proxy: "http://proxy.example.com:8080"
# Mandatory default no_proxy domains (cluster.local, 127.0.0.1, localhost, base_domain, machine_network_cidr)
# Additional custom no_proxy domains can be added below:
user_no_proxy_domains:
  - ".corp.example.com"
  - "192.168.0.0/16"

# ------------------------------------------------------------------------------
# 5. Additional Trusted Certificates (Enterprise Root/Intermediate CAs)
# ------------------------------------------------------------------------------
# If specified and file exists, contents will be embedded as additionalTrustBundle
# in install-config.yaml for custom registry or proxy interception certificates.
additional_trust_bundle_file: ""

# ------------------------------------------------------------------------------
# 6. Custom Day-0 Manifests Directory
# ------------------------------------------------------------------------------
# Any *.yaml / *.yml files in this directory are automatically copied into
# <install_dir>/openshift/ to be baked into Day-0 release ignition.
day0_manifests_dir: "{{ abi_project_root }}/manifests"

# ------------------------------------------------------------------------------
# 7. Time Synchronization (NTP / Chrony)
# ------------------------------------------------------------------------------
# Upstream NTP servers configured on all nodes
ntp_servers:
  - "192.168.10.1"
  - "time.cloudflare.com"

# ------------------------------------------------------------------------------
# 8. ISO Build Options
# ------------------------------------------------------------------------------
# Minimum number of masters required to proceed with installation
min_master_nodes: 3
