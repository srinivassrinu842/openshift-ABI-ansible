---
# ==============================================================================
# OpenShift Agent-Based Installer (ABI) - Global Cluster Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. Base Project Directory Reference
# ------------------------------------------------------------------------------
abi_project_root: "{{ playbook_dir if (playbook_dir | basename != 'playbooks') else (playbook_dir ~ '/..') }}"

# ------------------------------------------------------------------------------
# 1. OpenShift Version & Client Binaries
# ------------------------------------------------------------------------------
# Set target OpenShift version (e.g. "4.16.14", "4.16.20", "4.15.25", "4.14.38", or "latest")
ocp_version: "4.22.22"
download_binaries: true
bin_dir: "{{ abi_project_root }}/bin"
ocp_mirror_base_url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp"

# Optional: Override with custom direct URLs or internal enterprise repository
# custom_installer_url: "https://my-nexus.corp.example.com/ocp/openshift-install-linux.tar.gz"
# custom_client_url: "https://my-nexus.corp.example.com/ocp/openshift-client-linux.tar.gz"

# ------------------------------------------------------------------------------
# 2. Cluster Identity
# ------------------------------------------------------------------------------
cluster_name: "ocp-prod"
base_domain: "example.com"
cluster_fqdn: "{{ cluster_name }}.{{ base_domain }}"

# ------------------------------------------------------------------------------
# 3. Platform & Virtual IPs (VIPs)
# ------------------------------------------------------------------------------
# Supported platform_type: "baremetal" (built-in VIPs via keepalived) or "none" (external LB)
platform_type: "none"

# Virtual IPs for API and Ingress (required for platform_type: baremetal)
# If platform_type is "none", these can be omitted.
api_vips:
  - "192.168.10.5"
ingress_vips:
  - "192.168.10.6"

# ------------------------------------------------------------------------------
# 4. Agent-Based Installer Rendezvous Node
# ------------------------------------------------------------------------------
# The rendezvous node is the first master node that starts the embedded Assisted Service.
# This IP must match one of the master node IP addresses.
rendezvous_ip: "192.168.10.11"

# ------------------------------------------------------------------------------
# 5. Core Cluster Networking
# ------------------------------------------------------------------------------
network_type: "OVNKubernetes"
cluster_network_cidr: "100.96.0.0/14"
cluster_network_host_prefix: 21
service_network_cidr: "100.100.0.0/16"

# Machine network CIDR is OPTIONAL in OpenShift.
# If omitted or set to empty string (""), machineNetwork will NOT be included in install-config.yaml.
#machine_network_cidr: "192.168.10.0/24"
machine_network_cidr: ""

# ------------------------------------------------------------------------------
# 6. Day-0 Manifests & Additional Custom Configurations
# ------------------------------------------------------------------------------
# Any *.yaml or *.yml files placed in this directory are automatically copied
# into <install_dir>/openshift/ and baked into the bootable ISO.
day0_manifests_dir: "{{ abi_project_root }}/manifests"

# ------------------------------------------------------------------------------
# 7. Enterprise Proxy Configuration
# ------------------------------------------------------------------------------
# If proxy_enabled is false, or http_proxy is empty/omitted, NO proxy block is included in install-config.yaml.
proxy_enabled: false
http_proxy: ""
https_proxy: ""
# Custom no_proxy entries to append to default list (.cluster.local, 127.0.0.1, .basedomain, machine cidr, etc.)
custom_no_proxy: []

# ------------------------------------------------------------------------------
# 8. Enterprise Security & Trust
# ------------------------------------------------------------------------------
fips_enabled: false

# Enterprise CA Certificate / Internal Registry CA (PEM format)
# If both additional_trust_bundle_file and additional_trust_bundle_raw are empty/omitted,
# additionalTrustBundle will NOT be included in install-config.yaml.
additional_trust_bundle_file: ""
additional_trust_bundle_raw: ""

# Red Hat Pull Secret (Raw string or path to file)
pull_secret_file: "{{ abi_project_root }}/pull-secret.txt"
pull_secret_raw: ""

# Cluster SSH Public Key for core user
ssh_public_key_file: "~/.ssh/id_ed25519.pub"
ssh_public_key_raw: ""

# ------------------------------------------------------------------------------
# 9. Enterprise Time Synchronization (NTP)
# ------------------------------------------------------------------------------
# If additional_ntp_sources is omitted or empty, additionalNTPSources will NOT be included in agent-config.yaml.
additional_ntp_sources:
  - "192.168.10.1"
  - "time.corp.example.com"

# ------------------------------------------------------------------------------
# 10. Disconnected / Air-gapped Registry Mirroring (Optional)
# ------------------------------------------------------------------------------
# If disconnected_install is false or image_digest_sources is empty/omitted,
# imageDigestSources will NOT be included in install-config.yaml.
disconnected_install: false
image_digest_sources: []

# ------------------------------------------------------------------------------
# 11. Staging & Output Directories
# ------------------------------------------------------------------------------
abi_workspace_dir: "{{ abi_project_root }}/build"
abi_install_dir: "{{ abi_workspace_dir }}/installer_dir"
abi_backup_dir: "{{ abi_workspace_dir }}/rendered_configs"
abi_iso_output_dir: "{{ abi_workspace_dir }}/iso"
