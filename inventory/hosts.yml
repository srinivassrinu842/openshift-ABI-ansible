---
all:
  children:
    bastion:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    masters:
      hosts:
        master-01.example.com:
          role: master
          is_rendezvous: true
        master-02.example.com:
          role: master
          is_rendezvous: false
        master-03.example.com:
          role: master
          is_rendezvous: false

    workers:
      hosts:
        worker-01.example.com:
          role: worker
        worker-02.example.com:
          role: worker

    ocp_nodes:
      children:
        masters:
        workers:
